name: Verify Shield Android 11 installation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Download the exact published TV APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download v1.0.1 --pattern 'Glitch-Reflections-TV-2.0.1.apk' --dir apks
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify installation through the Android TV 11 installer UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none
          script: python3 .github/workflows/installer-ui.py
      - name: Save exact installation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Shield-Android-11-installation
          path: verification
          retention-days: 14
