name: Deploy Glitch Icons to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out donation assets
        uses: actions/checkout@v6
      - name: Download the complete site source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download --pattern 'Glitch-Icons-GitHub-Pages.zip' --dir "$RUNNER_TEMP/glitch-source"
      - name: Extract site and configure repository links
        env:
          SITE_REPOSITORY: ${{ github.repository }}
          SITE_BUILD: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, zipfile, shutil
          from pathlib import Path
          archive = Path(os.environ['RUNNER_TEMP']) / 'glitch-source' / 'Glitch-Icons-GitHub-Pages.zip'
          root = Path('glitch-icons').resolve()
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  target = Path(item.filename).resolve()
                  if not target.is_relative_to(root):
                      raise ValueError('Unexpected archive path')
              z.extractall('.')
          docs = root / 'docs'
          repo = os.environ['SITE_REPOSITORY']
          (docs / 'config.js').write_text('window.GLITCH_CONFIG = '+json.dumps({'repository':repo})+';\n')
          html = docs / 'index.html'
          content = html.read_text().replace('mickyharu-dot/glitch-icons',repo).replace('MYKLHARU/glitch-icons',repo)
          apk_url = 'https://github.com/'+repo+'/releases/latest/download/Glitch-Reflections.apk'
          apk_button = '<a class="button primary apk-download" href="'+apk_url+'">Download APK <span aria-hidden="true">↓</span></a>'
          content = content.replace('class="button primary pack-download"','class="text-link pack-download"')
          content = content.replace('Download the pack','Download APNG ZIP').replace('Download Glitch Icons','Download icon ZIP')
          content = content.replace('<div class="hero-actions">','<div class="hero-actions">'+apk_button)
          content = content.replace('<div class="download-actions">','<div class="download-actions">'+apk_button+'<span class="download-meta">Glitch-Reflections.apk · Android · ~217 MB</span>')
          content = content.replace('This download contains the icon artwork as APNG files. An APK is not included.','Yes. Download Glitch-Reflections.apk using the APK button above. The APNG icon ZIP is also available separately.')
          support = Path('support.html').read_text()
          assert content.count('<section class="faq wrap"') == 1, 'Cannot locate donation section insertion point'
          content = content.replace('<section class="faq wrap"', support+'\n    <section class="faq wrap"', 1)
          content = content.replace('<a class="repository-link"', '<a href="#support">Support</a><a class="repository-link"', 1)
          shutil.copyfile('support-paypal.png', docs/'support-paypal.png')
          with (docs/'style.css').open('a') as styles:
              styles.write('\n'+Path('support.css').read_text())
          for asset in ('style.css','config.js','catalog.js','app.js','support-paypal.png'):
              content = content.replace(chr(34)+asset+chr(34), chr(34)+asset+'?v='+os.environ['SITE_BUILD']+chr(34))
          html.write_text(content)
          PY
      - name: Apply current icons, download links and sorting
        env:
          SITE_REPOSITORY: ${{ github.repository }}
          SITE_BUILD: ${{ github.run_id }}
        run: python3 website/build.py glitch-icons
      - name: Validate every animation
        run: python3 glitch-icons/tools/validate_pack.py
      - name: Package the complete updated icon ZIP for the website
        run: python3 glitch-icons/tools/package_release.py glitch-icons/docs/downloads
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: glitch-icons/docs
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4



