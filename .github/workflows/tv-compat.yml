name: Verify older Shield compatibility
on:
  workflow_dispatch:
    inputs:
      android_api:
        description: Android API to verify
        type: choice
        default: all
        options: [all, '21', '26', '30']
permissions:
  contents: read
jobs:
  tv:
    strategy:
      fail-fast: false
      matrix:
        # The archived TV 21 image only ships a retired QEMU1 kernel.
        # The maintained Google API 21 image has the supported ranchu kernel.
        include: ${{ fromJSON(inputs.android_api == 'all' && '[{"api":21,"target":"google_apis"},{"api":26,"target":"android-tv"},{"api":30,"target":"android-tv"}]' || inputs.android_api == '21' && '[{"api":21,"target":"google_apis"}]' || inputs.android_api == '26' && '[{"api":26,"target":"android-tv"}]' || '[{"api":30,"target":"android-tv"}]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image comparison dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow numpy
      - name: Restore compatibility source and exact original artwork
        run: |
          unzip -q Glitch-Reflections-TV-compatibility-source.zip -d tv
          cd tv
          python3 prepare_assets.py
      - name: Download published TV version for old-Android comparison
        if: matrix.api < 28
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download v1.0.1 --pattern 'Glitch-Reflections-TV-2.0.1.apk' --dir apks
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build compatibility candidate with disposable test signature
        working-directory: tv
        env:
          ANDROID_JAR: /usr/local/lib/android/sdk/platforms/android-35/android.jar
          BUILD_TOOLS: /usr/local/lib/android/sdk/build-tools/35.0.0
        run: |
          bash build.sh
          keytool -genkeypair -keystore build/test.jks -alias smoke-test -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Ephemeral emulator test only' -storepass android -keypass android
          "$BUILD_TOOLS/apksigner" sign --ks build/test.jks --ks-pass pass:android --out build/test.apk build/Glitch-Reflections-TV-unsigned.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android TV ${{ matrix.api }} navigation and original frame playback
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          emulator-boot-timeout: 240
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none
          script: |
            python3 .github/workflows/verify-compat-install.py
            cd tv && python3 verify_compatibility.py
      - name: Save verification screenshots and frame comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-TV-compatibility-API-${{ matrix.api }}
          path: tv/verification
          retention-days: 14
